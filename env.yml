name: prms_gal
channels:
  - conda-forge
  - nodefaults
dependencies:
  # --- Core ---
  - python=3.12            # pywatershed supports 3.12 (newer releases may allow more)
  - pip
  - jupyterlab
  - ipykernel

  # --- pywatershed core dependencies ---
  - numpy
  - numba
  - pandas
  - xarray
  - netcdf4
  - networkx
  - pyyaml
  - scipy
  - matplotlib
  - tqdm

  # --- Geospatial stack (Domain_Builder / HRU_Stats style workflows) ---
  - geopandas
  - shapely
  - pyproj
  - fiona
  - rasterio
  - rioxarray
  - gdal
  - rasterstats
  - contextily
  - cartopy

  # --- Data retrieval (NHM / NHDPlus / gridded climate) ---
  - requests
  - pynhd
  - pygeohydro
  - pygridmet
  - py3dep

  # --- pip-only ---
  - pip:
      - pywatershed